<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="BookSlot">
  <!-- Same mark as LogoMark (src/components/logo.tsx), with no background:
       dark lines on light tab bars, light lines on dark ones. -->
  <style>
    .line { stroke: #18181b; }
    .dot { fill: #a1a1aa; }
    .accent { fill: #4f39f6; }
    @media (prefers-color-scheme: dark) {
      .line { stroke: #f4f4f5; }
      .dot { fill: #71717a; }
      .accent { fill: #7c86ff; }
    }
  </style>
  <rect class="line" x="3.1" y="5.5" width="25.8" height="23.5" rx="5" stroke-width="2.2"/>
  <path class="line" d="M3.1 11.3H28.9" stroke-width="2.2"/>
  <circle class="dot" cx="8.6" cy="16.4" r="1.6"/>
  <circle class="dot" cx="16" cy="16.4" r="1.6"/>
  <circle class="dot" cx="23.4" cy="16.4" r="1.6"/>
  <circle class="dot" cx="8.6" cy="23.4" r="1.6"/>
  <rect class="accent" x="8.2" y="2.4" width="2.6" height="6" rx="1.3"/>
  <rect class="accent" x="21.2" y="2.4" width="2.6" height="6" rx="1.3"/>
  <rect class="accent" x="13" y="20.7" width="13.8" height="5.4" rx="2.7"/>
  <path d="M16.6 23.4l1.5 1.5 3.1-3.2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
